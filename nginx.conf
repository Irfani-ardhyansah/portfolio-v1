server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	absolute_redirect off;

	# HTML is built with BASE_PATH=/portfolio, so the browser requests
	# /portfolio/_astro/*.css (and /portfolio/work/, images, etc).
	# Files on disk live at the nginx root (/_astro/, /work/, /images/).
	#
	# Edge Nginx already strips /portfolio via proxy_pass, so this is a
	# no-op there. Direct :8080 and ngrok (no strip) need this rewrite.
	location = /portfolio {
		return 301 /portfolio/;
	}

	location /portfolio/ {
		rewrite ^/portfolio/(.*)$ /$1 last;
	}

	# Serve Astro multi-page static output reliably
	# /work  -> /work/ -> /work/index.html
	location / {
		try_files $uri $uri/ $uri/index.html =404;
	}

	# Cache static assets lightly
	location /_astro/ {
		try_files $uri =404;
		expires 7d;
		add_header Cache-Control "public";
	}

	location /images/ {
		try_files $uri =404;
		expires 7d;
		add_header Cache-Control "public";
	}
}
