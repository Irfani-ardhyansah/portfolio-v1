server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	absolute_redirect off;

	# Serve Astro multi-page static output reliably
	# /work  -> /work/ -> /work/index.html
	location / {
		try_files $uri $uri/ $uri/index.html =404;
	}

	# Cache static assets lightly
	location /_astro/ {
		try_files $uri =404;
		expires 7d;
		add_header Cache-Control "public";
	}

	location /images/ {
		try_files $uri =404;
		expires 7d;
		add_header Cache-Control "public";
	}
}
