# Lightweight static portfolio for low-resource hosts (STB / small VPS).
# Joins external `shared_net` so an Nginx reverse-proxy container can reach it.
services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # App is reverse-proxied at http://host/portfolio/
        BASE_PATH: /portfolio
    image: portfolio:web
    container_name: portfolio
    # Direct / ngrok: http://host:8080/portfolio/  (share https://<ngrok>/portfolio/)
    # Via edge Nginx on shared_net: proxy_pass http://portfolio:8080/
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=8m,mode=1777
    networks:
      - shared_net

networks:
  shared_net:
    external: true
