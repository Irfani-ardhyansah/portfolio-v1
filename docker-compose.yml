# Lightweight static portfolio for low-resource hosts (STB / small VPS).
# Joins external `shared_net` so an Nginx reverse-proxy container can reach it.
services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Nginx serves this app at http://host/portfolio/
        # For root path instead: BASE_PATH=/
        BASE_PATH: /portfolio
    image: portfolio:busybox
    container_name: portfolio
    # Optional host access for debug: http://host:8080
    # Note: with BASE_PATH=/portfolio, open http://host:8080/portfolio/
    # Nginx on shared_net can use: http://portfolio:8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Keep footprint tiny on constrained devices
    mem_limit: 32m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks:
      - shared_net

networks:
  shared_net:
    external: true
