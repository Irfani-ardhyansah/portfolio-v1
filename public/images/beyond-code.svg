<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none">
  <rect width="900" height="700" fill="#111821"/>
  <rect x="48" y="72" width="804" height="556" rx="16" fill="#161f2b" stroke="#243041"/>
  <text x="72" y="48" fill="#8b9bb0" font-family="monospace" font-size="14">cross-team coordination</text>

  <!-- Client -->
  <rect x="90" y="280" width="180" height="100" rx="10" fill="#0a0e14" stroke="#243041"/>
  <text x="180" y="325" text-anchor="middle" fill="#e6edf5" font-family="monospace" font-size="16">Client</text>
  <text x="180" y="350" text-anchor="middle" fill="#8b9bb0" font-family="monospace" font-size="12">stakeholders</text>

  <!-- You / POC -->
  <rect x="360" y="260" width="180" height="140" rx="10" fill="#0a0e14" stroke="#22d3ee" stroke-opacity="0.65"/>
  <text x="450" y="310" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="13">YOU</text>
  <text x="450" y="338" text-anchor="middle" fill="#e6edf5" font-family="monospace" font-size="18">POC</text>
  <text x="450" y="365" text-anchor="middle" fill="#8b9bb0" font-family="monospace" font-size="12">liaison</text>

  <!-- Dev Team -->
  <rect x="630" y="280" width="180" height="100" rx="10" fill="#0a0e14" stroke="#243041"/>
  <text x="720" y="325" text-anchor="middle" fill="#e6edf5" font-family="monospace" font-size="16">Dev Team</text>
  <text x="720" y="350" text-anchor="middle" fill="#8b9bb0" font-family="monospace" font-size="12">engineering</text>

  <!-- Arrows Client <-> You -->
  <path d="M270 320 H350" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
  <polygon points="350,316 362,320 350,324" fill="#22d3ee" opacity="0.8"/>
  <path d="M350 340 H270" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/>
  <polygon points="270,336 258,340 270,344" fill="#22d3ee" opacity="0.45"/>

  <!-- Arrows You <-> Dev -->
  <path d="M540 320 H630" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
  <polygon points="630,316 642,320 630,324" fill="#22d3ee" opacity="0.8"/>
  <path d="M630 340 H540" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/>
  <polygon points="540,336 528,340 540,344" fill="#22d3ee" opacity="0.45"/>

  <text x="450" y="480" text-anchor="middle" fill="#8b9bb0" font-family="monospace" font-size="13">Client ↔ You (POC) ↔ Dev Team</text>
</svg>
